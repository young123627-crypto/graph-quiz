<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>그래프 총정리</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#f5f8ff;color:#172033;min-height:100vh}
button{font:inherit;touch-action:manipulation;cursor:pointer}
header{background:white;border-bottom:1px solid #dfe6f2;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}
h1{font-size:clamp(25px,3vw,38px);margin:0}
.progress{font-size:18px;font-weight:700;background:#eef3ff;padding:10px 16px;border-radius:999px}
main{max-width:1180px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 7px 24px rgba(40,65,110,.09);min-height:650px}
.step{font-size:19px;font-weight:800;color:#4263eb;margin-bottom:8px}
.question{font-size:clamp(25px,3vw,38px);font-weight:900;text-align:center;margin:12px 0 25px}
.graphbox{height:330px;display:flex;align-items:center;justify-content:center;margin:0 auto 25px;max-width:820px}
svg{width:100%;height:100%;overflow:visible}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:0 auto}
.option{min-height:82px;border:3px solid #cfd8e8;background:#fff;border-radius:18px;font-size:clamp(20px,2.4vw,30px);font-weight:900;padding:12px}
.option:hover,.option:focus{border-color:#6b8cff;background:#f4f7ff}
.option.correct{background:#e6f8ed;border-color:#27ae60;color:#14743d}
.option.wrong{background:#fff0f0;border-color:#e05252;color:#a82929}
.feedback{height:58px;text-align:center;font-size:25px;font-weight:900;margin-top:18px}
.next{display:none;margin:4px auto 0;border:0;background:#315bea;color:white;border-radius:16px;padding:16px 42px;font-size:23px;font-weight:900}
.situation{max-width:800px;margin:25px auto 35px;padding:35px 20px;border-radius:22px;background:#f3f6ff;text-align:center;font-size:clamp(26px,3.3vw,42px);font-weight:900;line-height:1.45}
.mini{display:block;font-size:19px;font-weight:700;color:#5b6577;margin-top:12px}
.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-size:18px;font-weight:800}
.legend span{display:flex;align-items:center;gap:7px}.dot{width:16px;height:16px;border-radius:4px;display:inline-block}
.result{text-align:center;padding-top:75px}.result h2{font-size:45px;margin:0 0 18px}.result p{font-size:25px;line-height:1.7}
.restart{border:0;background:#315bea;color:white;border-radius:18px;padding:18px 42px;font-size:24px;font-weight:900;margin-top:18px}

.cover{min-height:650px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-title{font-size:clamp(42px,7vw,82px);font-weight:900;letter-spacing:-2px;margin:0 0 55px;color:#243b7a}
.start-btn{border:0;background:#315bea;color:#fff;border-radius:22px;padding:20px 65px;font-size:clamp(24px,3vw,34px);font-weight:900;box-shadow:0 8px 18px rgba(49,91,234,.22)}
.start-btn:active{transform:scale(.98)}

@media(max-width:720px){
 header{padding:14px} main{padding:12px}.card{padding:18px;min-height:600px}.options{grid-template-columns:1fr}.option{min-height:68px}.graphbox{height:285px}.question{margin-top:8px}.situation{padding:28px 15px}
}
</style>
</head>
<body>
<header><h1>📊 그래프 총정리</h1><div class="progress" id="progress">1 / 9</div></header>
<main><section class="card" id="app"></section></main>
<script>
const questions=[
 {type:"name",title:"이 그래프의 이름은 무엇일까요?",graph:"line",answer:"꺾은선 그래프",opts:["꺾은선 그래프","원그래프","띠그래프"]},
 {type:"name",title:"이 그래프의 이름은 무엇일까요?",graph:"pie",answer:"원그래프",opts:["띠그래프","원그래프","꺾은선 그래프"]},
 {type:"name",title:"이 그래프의 이름은 무엇일까요?",graph:"strip",answer:"띠그래프",opts:["원그래프","꺾은선 그래프","띠그래프"]},

 {type:"choose",title:"어떤 그래프로 나타내면 좋을까요?",situation:"월요일부터 금요일까지<br>기온의 변화",sub:"시간에 따라 어떻게 변하는지 알아보아요.",answer:"꺾은선 그래프",opts:["원그래프","꺾은선 그래프","띠그래프"]},
 {type:"choose",title:"어떤 그래프로 나타내면 좋을까요?",situation:"우리 반 학생들이<br>좋아하는 계절의 비율",sub:"전체에서 각 계절이 차지하는 비율을 알아보아요.",answer:"원그래프",opts:["띠그래프","원그래프","꺾은선 그래프"]},
 {type:"choose",title:"어떤 그래프로 나타내면 좋을까요?",situation:"1반과 2반의<br>등교 방법 비율 비교",sub:"두 반의 비율을 서로 비교해 보아요.",answer:"띠그래프",opts:["꺾은선 그래프","띠그래프","원그래프"]},
 {type:"choose",title:"어떤 그래프로 나타내면 좋을까요?",situation:"아침부터 저녁까지<br>시간에 따른 온도 변화",sub:"시간이 지나면서 값이 어떻게 달라지는지 살펴보아요.",answer:"꺾은선 그래프",opts:["띠그래프","원그래프","꺾은선 그래프"]},
 {type:"choose",title:"어떤 그래프로 나타내면 좋을까요?",situation:"우리 반 학생들의<br>좋아하는 과일 비율",sub:"전체 학생 중 각 과일을 좋아하는 학생의 비율을 알아보아요.",answer:"원그래프",opts:["원그래프","꺾은선 그래프","띠그래프"]},

 {type:"read",title:"기온이 가장 높은 날은 언제일까요?",graph:"lineRead",answer:"목요일",opts:["화요일","목요일","금요일"]},
 {type:"read",title:"가장 좋아하는 계절은 무엇일까요?",graph:"pieRead",answer:"봄",opts:["봄","여름","겨울"]},
 {type:"read",title:"버스를 이용하는 학생의 비율이 더 높은 반은?",graph:"stripRead",answer:"2반",opts:["1반","2반","같아요"]},
 {type:"read",title:"월요일보다 기온이 낮은 날이 있을까요?",graph:"lineRead",answer:"없어요",opts:["있어요","없어요","알 수 없어요"]},

 {type:"challenge",title:"기온이 전날보다 내려간 날을 모두 찾아보세요.",graph:"lineRead",answer:"수요일, 금요일",opts:["화요일, 목요일","수요일, 금요일","목요일, 금요일"]},
 {type:"challenge",title:"1반과 2반의 버스 이용 비율 차이는 몇 %p일까요?",graph:"stripRead",answer:"30%p",opts:["20%p","30%p","50%p"]},
 {type:"challenge",title:"그래프를 보고 알 수 있는 내용으로 알맞은 것은?",graph:"lineRead",answer:"목요일이 가장 높고 수요일과 금요일에는 전날보다 기온이 내려갔어요.",opts:["기온은 매일 계속 올라갔어요.","목요일이 가장 높고 수요일과 금요일에는 전날보다 기온이 내려갔어요.","월요일과 금요일의 기온은 같아요."]}
];
let idx=0, score=0, locked=false;
const app=document.getElementById("app"), prog=document.getElementById("progress");

function showCover(){
  prog.style.display="none";
  app.innerHTML=`<div class="cover">
    <div class="cover-title">그래프 총정리 퀴즈</div>
    <button class="start-btn" id="startQuiz">시작하기</button>
  </div>`;
  document.getElementById("startQuiz").addEventListener("click",()=>{
    prog.style.display="block";
    render();
  });
}

function graph(kind){
 if(kind==="line"||kind==="lineRead"){
   const vals=kind==="lineRead"?[18,21,20,27,23]:[16,20,18,24,22];
   const labs=kind==="lineRead"?["월요일","화요일","수요일","목요일","금요일"]:["1","2","3","4","5"];
   let pts=vals.map((v,i)=>`${105+i*135},${275-(v-10)*10}`).join(" ");
   let circles=vals.map((v,i)=>`<circle cx="${105+i*135}" cy="${275-(v-10)*10}" r="8" fill="#315bea"/>`).join("");
   let labels=labs.map((x,i)=>`<text x="${105+i*135}" y="305" text-anchor="middle" font-size="18" font-weight="700">${x}</text>`).join("");
   return `<svg viewBox="0 0 700 330"><line x1="70" y1="20" x2="70" y2="280" stroke="#566" stroke-width="3"/><line x1="70" y1="280" x2="660" y2="280" stroke="#566" stroke-width="3"/>
   ${[15,20,25,30].map(v=>`<text x="55" y="${280-(v-10)*10+6}" text-anchor="end" font-size="16">${v}℃</text><line x1="70" y1="${280-(v-10)*10}" x2="660" y2="${280-(v-10)*10}" stroke="#e2e7ef"/>`).join("")}
   <polyline points="${pts}" fill="none" stroke="#315bea" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>${circles}${labels}</svg>`;
 }
 if(kind==="pie"||kind==="pieRead"){
   if(kind==="pie") return `<svg viewBox="0 0 700 330"><circle cx="350" cy="160" r="125" fill="#ffd166"/><path d="M350 160 L350 35 A125 125 0 0 1 475 160 Z" fill="#6ecbff"/><path d="M350 160 L475 160 A125 125 0 0 1 350 285 Z" fill="#ff8fa3"/><path d="M350 160 L350 285 A125 125 0 0 1 225 160 Z" fill="#8bd3a8"/></svg>`;
   return `<svg viewBox="0 0 700 330">
   <circle cx="300" cy="155" r="125" fill="#ffd166"/>
   <path d="M300 155 L300 30 A125 125 0 0 1 418 114 Z" fill="#6ecbff"/>
   <path d="M300 155 L418 114 A125 125 0 0 1 373 256 Z" fill="#ff8fa3"/>
   <path d="M300 155 L373 256 A125 125 0 0 1 199 228 Z" fill="#9b8cff"/>
   <path d="M300 155 L199 228 A125 125 0 0 1 300 30 Z" fill="#8bd3a8"/>
   <g font-size="20" font-weight="800"><rect x="480" y="70" width="20" height="20" fill="#8bd3a8"/><text x="510" y="87">봄</text><rect x="480" y="110" width="20" height="20" fill="#6ecbff"/><text x="510" y="127">여름</text><rect x="480" y="150" width="20" height="20" fill="#ff8fa3"/><text x="510" y="167">가을</text><rect x="480" y="190" width="20" height="20" fill="#9b8cff"/><text x="510" y="207">겨울</text></g></svg>`;
 }
 if(kind==="strip"||kind==="stripRead"){
   if(kind==="strip") return `<svg viewBox="0 0 700 330"><rect x="80" y="110" width="540" height="90" rx="8" fill="#eee"/><rect x="80" y="110" width="216" height="90" fill="#6ecbff"/><rect x="296" y="110" width="162" height="90" fill="#ffd166"/><rect x="458" y="110" width="162" height="90" fill="#8bd3a8"/><g stroke="white" stroke-width="4"><line x1="296" y1="110" x2="296" y2="200"/><line x1="458" y1="110" x2="458" y2="200"/></g><text x="350" y="235" text-anchor="middle" font-size="18" font-weight="700">전체 100%</text></svg>`;
   return `<svg viewBox="0 0 700 330"><g font-size="21" font-weight="800"><text x="80" y="95">1반</text><text x="80" y="205">2반</text></g>
   <rect x="140" y="55" width="450" height="65" rx="5" fill="#ffd166"/><rect x="140" y="55" width="135" height="65" rx="5" fill="#6ecbff"/>
   <rect x="140" y="165" width="450" height="65" rx="5" fill="#ffd166"/><rect x="140" y="165" width="270" height="65" fill="#6ecbff"/>
   <g font-size="18" font-weight="900" text-anchor="middle" fill="#172033">
     <text x="207.5" y="94">버스 30%</text><text x="432.5" y="94">그 외 70%</text>
     <text x="275" y="204">버스 60%</text><text x="500" y="204">그 외 40%</text>
   </g>
   <g font-size="18" font-weight="800"><rect x="220" y="270" width="18" height="18" fill="#6ecbff"/><text x="247" y="286">버스</text><rect x="350" y="270" width="18" height="18" fill="#ffd166"/><text x="377" y="286">그 외</text></g></svg>`;
 }
}
function render(){
 locked=false; prog.textContent=`${idx+1} / ${questions.length}`;
 const q=questions[idx];
 let visual=(q.type==="choose"||q.type==="challengeChoose")?`<div class="situation">${q.situation}<span class="mini">${q.sub}</span></div>`:`<div class="graphbox">${graph(q.graph)}</div>`;
 app.innerHTML=`<div class="step">${q.type==="name"?"활동 1 · 그래프 이름":(q.type==="choose"||q.type==="challengeChoose")?(q.type==="challengeChoose"?"활동 4 · 그래프 생각하기":"활동 2 · 알맞은 그래프"):(q.type==="challenge"?"활동 4 · 그래프 생각하기":"활동 3 · 그래프 읽기")}</div>
 <div class="question">${q.title}</div>${visual}
 <div class="options">${q.opts.map(x=>`<button class="option" data-v="${x}">${x}</button>`).join("")}</div>
 <div class="feedback" id="feedback"></div><button class="next" id="next">${idx===questions.length-1?"결과 보기":"다음 문제"}</button>`;
 document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>answer(b,q)));
 document.getElementById("next").addEventListener("click",next);
}
function answer(btn,q){
 if(locked)return; locked=true;
 const ok=btn.dataset.v===q.answer;
 if(ok){score++;btn.classList.add("correct");document.getElementById("feedback").textContent="정답이에요! 👏";}
 else{btn.classList.add("wrong");document.getElementById("feedback").textContent=`정답은 ‘${q.answer}’입니다.`;document.querySelectorAll(".option").forEach(x=>{if(x.dataset.v===q.answer)x.classList.add("correct")});}
 document.getElementById("next").style.display="block";
}
function next(){if(idx<questions.length-1){idx++;render()}else finish()}
function finish(){
 prog.textContent="완료";
 app.innerHTML=`<div class="result"><h2>🎉 그래프 총정리 완료!</h2><p><b>${questions.length}문제 중 ${score}문제</b>를 맞혔어요.<br>꺾은선 그래프, 원그래프, 띠그래프를 다시 한번 살펴보았어요.</p><button class="restart">처음부터 다시하기</button></div>`;
 document.querySelector(".restart").addEventListener("click",()=>{idx=0;score=0;render()});
}
showCover();
</script>
</body>
</html>
